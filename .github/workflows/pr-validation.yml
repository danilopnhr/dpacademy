# Validação de todo PR para main (contrato: specs/002-naming-standard-cicd/contracts/ci-pipelines.md).
# O job "pr-validation" é o status check obrigatório do ruleset de main.
name: pr-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  pr-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: python -m pip install -r ci/requirements.txt

      - name: "1. Nomes dos itens"
        run: python ci/validate_names.py workspace/

      - name: "2. Testes unitários"
        run: python -m pytest tests/unit -q

      - name: "3. Segredos conhecidos no histórico"
        env:
          TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          found=0
          revs=$(git rev-list --all)
          for var in TRANSPARENCIA_API_KEY; do
            value="${!var:-}"
            if [ -z "$value" ]; then
              echo "::error::$var não está definida nos secrets do repositório"
              found=1
              continue
            fi
            hits=$(git grep -F -l -e "$value" $revs 2>/dev/null || true)
            if [ -n "$hits" ]; then
              while IFS= read -r hit; do
                echo "::error::segredo conhecido ($var) encontrado em $hit"
              done <<< "$hits"
              found=1
            fi
          done
          exit $found

      - name: "4. gitleaks no histórico"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source "$GITHUB_WORKSPACE" --log-opts="--all" --redact --no-banner
